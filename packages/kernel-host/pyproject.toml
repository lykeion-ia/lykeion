[project]
name = "lykeion-kernel"
version = "0.1.0"
description = "The per-machine process that holds a lab's kernels."
requires-python = ">=3.12"
# Bounded above as well as below, so this declaration and the resolved
# version in uv.lock say the same thing: a re-lock can neither drop to a
# major this package was never written against nor take the next one
# unread.
dependencies = ["mcp>=2,<3", "psutil>=6,<8"]

[project.scripts]
lykeion-kernel-host = "lykeion_kernel.host:main"

[dependency-groups]
# `anyio` is what the suite drives an asynchronous session from a synchronous
# test with. Declared rather than reached for through the SDK that happens to
# install it: a distribution nothing asks for is one that disappears the day
# whatever pulled it in stops needing it. It is a test dependency and not a
# dependency of what ships — the package's own code imports `mcp` and the
# standard library, and there is a test that says so.
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lykeion_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need a real interpreter this machine may not have. Marked rather
# than skipped by a local condition, so a run can select or exclude them.
markers = ["integration: needs an interpreter installed on the machine running it"]
